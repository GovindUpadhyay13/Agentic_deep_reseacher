version: '3.8'

services:
  karpathy-research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karpathy-deep-research
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
